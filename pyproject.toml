[project]
name = "careerops"
version = "0.1.0"
description = "Safety-first single-user career operations assistant"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.5,<2",
    "fastapi>=0.139.2,<0.140",
    "prometheus-client>=0.25.0,<0.26",
    "pydantic-settings>=2.14.2,<3",
    "psycopg[binary]>=3.3.4,<4",
    "sqlalchemy>=2.0.51,<2.1",
    "uvicorn>=0.51.0,<0.52",
    "temporalio>=1.30,<2",
    "redis>=6.4,<7",
    "argon2-cffi>=25.1,<26",
    "jinja2>=3.1,<4",
    "python-multipart>=0.0.20,<1",
]

[project.scripts]
careerops = "careerops:main"
careerops-bootstrap = "careerops.cli.auth:main"
careerops-d0 = "careerops.cli.d0:main"
careerops-crawl-sources = "careerops.cli.crawl_sources:main"
careerops-candidate-profiles = "careerops.cli.candidate_profiles:main"
careerops-crawler-execution = "careerops.cli.crawler_execution:main"
careerops-crawler-outbox = "careerops.cli.crawler_outbox:main"
careerops-database-url = "careerops.cli.database_url:main"
careerops-goal-runs = "careerops.cli.goal_runs:main"
careerops-gmail-broker = "careerops.cli.gmail_broker:main"
careerops-gmail-onboarding = "careerops.cli.gmail_onboarding:main"
careerops-gmail-readonly = "careerops.cli.gmail_readonly:main"
careerops-gmail-send = "careerops.cli.gmail_send:main"
careerops-greenhouse-submit = "careerops.cli.greenhouse_submit:main"
careerops-release-evidence = "careerops.cli.release_evidence:main"
careerops-source-registry = "careerops.cli.source_registry:main"
careerops-submission-outbox = "careerops.cli.submission_outbox:main"
careerops-worker = "careerops.infrastructure.temporal.worker:main"
careerops-worker-health = "careerops.infrastructure.temporal.health:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "bandit[toml]>=1.9,<2",
    "httpx2>=2.7.0,<3",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.3,<2",
    "pytest-cov>=7,<8",
    "ruff>=0.15.22",
]

[tool.hatch.build.targets.wheel]
packages = ["src/careerops"]

[tool.hatch.build.targets.wheel.force-include]
"scripts/verify_m1.py" = "careerops/_trusted/verify_m1.py"

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
markers = [
    "integration: requires a disposable service or the Temporal SDK test server",
]

[tool.coverage.run]
branch = true
source = ["careerops"]

[tool.coverage.report]
fail_under = 75
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
include = ["src", "tests"]
exclude = [".venv"]
strict = ["src"]
