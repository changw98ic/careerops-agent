{% extends "base.html" %}
{% block title %}初始化 · CareerOps{% endblock %}
{% block content %}
  <h1>初始化本机账户</h1>
  <p>请输入本机 CLI 一次性输出的 15 分钟凭据。</p>
  {% if error %}<p role="alert">{{ error }}</p>{% endif %}
  <form action="/bootstrap" method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>一次性凭据 <input name="bootstrap_token" type="password" autocomplete="off" maxlength="512" required></label>
    <label>用户名 <input name="username" autocomplete="username" maxlength="64" required></label>
    <label>密码 <input name="password" type="password" autocomplete="new-password" minlength="12" maxlength="1024" required></label>
    <button type="submit">创建账户</button>
  </form>
{% endblock %}
