{% extends "base.html" %}
{% block title %}登录 · CareerOps{% endblock %}
{% block content %}
  <h1>登录</h1>
  {% if error %}<p role="alert">{{ error }}</p>{% endif %}
  <form action="/login" method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>用户名 <input name="username" autocomplete="username" maxlength="64" required></label>
    <label>密码 <input name="password" type="password" autocomplete="current-password" maxlength="1024" required></label>
    <button type="submit">登录</button>
  </form>
{% endblock %}
