# Official static-HTML crawl recipe (Task 9).
#
# Translates ``StaticHtmlAdapter`` (adapters/job_sources.py) into the
# declarative recipe DSL. ``css`` mode reuses ``Field_.path`` as a CSS
# selector and zip-pairs columns by index — the index-aligned pairing the
# legacy adapter did with two parallel regex matches (titles + locations
# scanned independently, then zip-paired).
#
# Selector scope. The legacy regex ``class=["'][^"']*job[-_]?title`` accepts
# ``job_title`` / ``job-title`` / ``jobtitle`` (optional ``-`` or ``_``
# separator, or none). The CSS selector list below mirrors that coverage via
# three ``[class*=...]`` substring selectors joined by ``,`` (selectolax
# supports CSS selector lists): ``[class*=job_title], [class*=job-title],
# [class*=jobtitle]``. Document order across the union is preserved by
# selectolax, so the index-aligned zip-pairing still maps the Nth title to the
# Nth location. (PR #7 review fix batch 4: previously only the underscore form
# matched, silently dropping dash-form / concatenated job-board markup.)
#
# External id. Not declared as a field — the legacy adapter computes
# ``sha256(title.strip())[:16]`` in code, and the DSL has no sha256 transform.
# The recipe row therefore carries ``title`` / ``location`` only; the engine
# layer (``RecipeEngine._row_to_record``) derives the id. Parity compares the
# field-mapping layer (title / location) and excludes external_id.
#
# Endpoint templating. ``{base_url}`` is resolved from ``CrawlSource.base_url``
# at execute time.
recipe_version: "1"
source_type: official_static
executor_mode: http
match:
  url_patterns: []
  host_suffix: ""
steps:
  - id: fetch
    fetch:
      endpoint: "{base_url}"
    extract:
      mode: css
      fields:
        title: {path: "[class*=job_title], [class*=job-title], [class*=jobtitle]"}
        location: {path: "[class*=job_location], [class*=job-location], [class*=joblocation]"}
fallback: llm_skill
